[project]
name = "healthcare-federated-learning"
version = "1.0.0"
description = "Federated learning prototype for healthcare project"
license = { text = "Apache-2.0" }
dependencies = [
    "flwr[simulation]>=1.35.0",
    "numpy",
    "pandas",
    "scikit-learn",
    "pytorch-tabnet",
    "torch",
    "joblib",
    "sqlalchemy",
    "psycopg2-binary",
    "python-dotenv"
]

[tool.flwr.app]
publisher = "healthcare-project"

[tool.flwr.app.components]
serverapp = "federated_learning.flower_server:app"
clientapp = "federated_learning.flower_client:app"

[tool.flwr.app.config]
num-server-rounds = 3


